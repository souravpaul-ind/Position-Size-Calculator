<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Position Size Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}

body{
    background: radial-gradient(circle at 20% 20%, #1a2340 0%, #0b0e14 45%, #05070a 100%);
    font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem 1rem 3rem;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
}

body::before{
    content: '';
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #3b5bdb;
    filter: blur(100px);
    opacity: 0.28;
    top: -120px;
    left: -120px;
    z-index: 0;
    pointer-events: none;
    will-change: transform;
    animation: float1 22s ease-in-out infinite;
}
body::after{
    content: '';
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: #7b3fa0;
    filter: blur(100px);
    opacity: 0.28;
    bottom: -100px;
    right: -100px;
    z-index: 0;
    pointer-events: none;
    will-change: transform;
    animation: float2 26s ease-in-out infinite;
}

@keyframes float1{
    0%,100%{transform: translate(0,0)}
    50%{transform: translate(50px,30px)}
}
@keyframes float2{
    0%,100%{transform: translate(0,0)}
    50%{transform: translate(-40px,-25px)}
}

.wrapper{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Title */
.page-title{
    text-align: center;
    margin-bottom: 1.8rem;
    width: 100%;
    animation: titleIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.page-title h1{
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.6px;
    background: linear-gradient(135deg, #ffffff 0%, #a9c2ff 30%, #ffffff 50%, #7b9cff 80%, #ffffff 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.4rem;
    line-height: 1.2;
    animation: shimmer 8s linear infinite;
}
.page-title p{
    font-size: 0.9rem;
    color: #7f96b5;
    font-weight: 400;
    letter-spacing: 0.5px;
}
.page-title .underline{
    display: block;
    width: 70px;
    height: 3px;
    margin: 0.8rem auto 0;
    background: linear-gradient(90deg, transparent, #5b7cfa, transparent);
    border-radius: 3px;
    opacity: 0.7;
}

@keyframes titleIn{
    from{opacity: 0; transform: translateY(-12px)}
    to{opacity: 1; transform: translateY(0)}
}
@keyframes shimmer{
    0%{background-position: 0% 50%}
    100%{background-position: 200% 50%}
}

/* Card */
.card{
    position: relative;
    z-index: 1;
    width: 100%;
    background: rgba(24, 30, 39, 0.6);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-radius: 2rem;
    padding: 2.2rem 2rem 2.4rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    contain: layout style;
}

@keyframes cardIn{
    from{opacity: 0; transform: translateY(16px) scale(0.98)}
    to{opacity: 1; transform: translateY(0) scale(1)}
}

h2{
    font-size: 1.3rem;
    font-weight: 600;
    color: #eef2f8;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
    letter-spacing: -0.2px;
}
h2 span{
    background: rgba(59, 91, 219, 0.25);
    border: 1px solid rgba(91, 124, 250, 0.4);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.8rem;
    border-radius: 40px;
    color: #a9c2ff;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.grid{
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
}

/* Rows */
.row{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 0.9rem;
    background: rgba(19, 26, 36, 0.7);
    padding: 0.7rem 1.1rem;
    border-radius: 2rem;
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: border-color 0.2s ease, background 0.2s ease;
}
.row:hover{
    border-color: rgba(91, 124, 250, 0.3);
    background: rgba(23, 31, 44, 0.8);
}
.row.hidden{
    display: none;
}
.row label{
    min-width: 110px;
    font-weight: 500;
    color: #b6c8e2;
    font-size: 0.88rem;
    letter-spacing: 0.2px;
}
.row input{
    flex: 1;
    min-width: 90px;
    background: rgba(15, 21, 30, 0.9);
    border: 1px solid rgba(42, 51, 66, 0.8);
    border-radius: 40px;
    padding: 0.6rem 1.1rem;
    font-weight: 500;
    color: #f0f5fe;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
    -webkit-appearance: none;
    appearance: none;
}
.row input::placeholder{
    color: #4d5a6e;
    font-weight: 400;
}
.row input:focus{
    border-color: #5b7cfa;
    box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.15);
}
.row .badge{
    background: rgba(32, 43, 59, 0.85);
    border: 1px solid rgba(91, 124, 250, 0.2);
    padding: 0.2rem 0.85rem;
    border-radius: 30px;
    font-size: 0.7rem;
    font-weight: 600;
    color: #a2bbdf;
    letter-spacing: 0.3px;
    text-transform: uppercase;
}

/* Coin row compact */
.row.coin-row{
    padding: 0.55rem 0.9rem;
}
.row.coin-row label{
    min-width: 60px;
    font-size: 0.82rem;
}
.row.coin-row .toggle-group{
    gap: 0.4rem;
}
.row.coin-row .toggle-btn{
    padding: 0.5rem 0.6rem;
    font-size: 0.8rem;
}

/* Toggle buttons */
.toggle-group{
    flex: 1;
    display: flex;
    gap: 0.5rem;
    min-width: 0;
}
.toggle-btn{
    flex: 1;
    background: rgba(15, 21, 30, 0.9);
    border: 1px solid rgba(42, 51, 66, 0.8);
    border-radius: 40px;
    padding: 0.6rem 0.8rem;
    font-weight: 600;
    font-size: 0.88rem;
    color: #8ba0c0;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.12s ease;
    letter-spacing: 0.2px;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
.toggle-btn:hover{
    color: #e0edff;
    border-color: rgba(91, 124, 250, 0.4);
}
.toggle-btn:active{
    transform: scale(0.97);
}
.toggle-btn.active{
    background: linear-gradient(135deg, #2f405b, #3d5a9b);
    color: #ffffff;
    border-color: #5b7cfa;
    box-shadow: 0 0 12px rgba(91, 124, 250, 0.35);
}
.toggle-btn.active.long{
    background: linear-gradient(135deg, #1a4a3a, #2a6a4a);
    border-color: #4ab87a;
    box-shadow: 0 0 12px rgba(74, 184, 122, 0.35);
    color: #b7f0cf;
}
.toggle-btn.active.short{
    background: linear-gradient(135deg, #4a1a2a, #6a2a3a);
    border-color: #d85a7a;
    box-shadow: 0 0 12px rgba(216, 90, 122, 0.35);
    color: #f5b7c7;
}

.divider{
    border: none;
    border-top: 1px dashed rgba(255, 255, 255, 0.08);
    margin: 1.2rem 0 0.7rem;
}

/* Output */
.output-grid{
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}
.output-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.65rem 1.2rem;
    background: rgba(15, 23, 34, 0.65);
    border-radius: 60px;
    border-left: 3px solid #3d5a9b;
    transition: background 0.2s ease, transform 0.15s ease;
}
.output-row:hover{
    background: rgba(20, 30, 45, 0.8);
}
.output-row.dim{
    opacity: 0.45;
}
.output-row.dim .value{
    color: #5a6a80;
}
.output-row .label{
    color: #a8bedd;
    font-size: 0.88rem;
    font-weight: 450;
}
.output-row .value{
    font-weight: 600;
    font-size: 1.05rem;
    color: #e3ecfc;
    transition: color 0.2s ease;
    font-variant-numeric: tabular-nums;
}
.output-row .value.highlight{color:#7be3a3}
.output-row .value.warn{color:#f5b778}
.output-row .value.danger{color:#f58b7b}

.value{
    transition: color 0.25s ease, text-shadow 0.25s ease;
}
.value.flash{
    animation: valueFlash 0.4s ease;
}
@keyframes valueFlash{
    0%{text-shadow: 0 0 0 rgba(91,124,250,0)}
    40%{text-shadow: 0 0 12px rgba(91,124,250,0.8)}
    100%{text-shadow: 0 0 0 rgba(91,124,250,0)}
}

.warning-box{
    background: rgba(60, 35, 20, 0.6);
    border: 1px solid rgba(180, 110, 60, 0.4);
    border-radius: 2rem;
    padding: 0.6rem 1rem;
    margin-top: 0.6rem;
    color: #f0b98a;
    font-size: 0.82rem;
    text-align: center;
    animation: warnIn 0.3s ease;
}
@keyframes warnIn{
    from{opacity: 0; transform: translateY(-4px)}
    to{opacity: 1; transform: translateY(0)}
}

/* 🌟 Desktop: Larger tablet-like layout (900px+) */
@media (min-width: 900px){
    body{
        padding: 3rem 2rem 4rem;
    }
    .wrapper{
        max-width: 720px;
    }
    .page-title h1{
        font-size: 2.6rem;
    }
    .page-title p{
        font-size: 0.95rem;
    }
    .card{
        padding: 2.6rem 2.4rem 2.8rem;
        border-radius: 2.4rem;
    }
    h2{
        font-size: 1.45rem;
        margin-bottom: 1.8rem;
    }
    .grid{
        gap: 0.85rem;
    }
    .row{
        padding: 0.85rem 1.3rem;
        gap: 0.7rem 1.1rem;
    }
    .row label{
        min-width: 130px;
        font-size: 0.95rem;
    }
    .row input{
        padding: 0.7rem 1.3rem;
        font-size: 1rem;
    }
    .row.coin-row{
        padding: 0.7rem 1.1rem;
    }
    .row.coin-row label{
        min-width: 70px;
        font-size: 0.88rem;
    }
    .row.coin-row .toggle-btn{
        padding: 0.6rem 0.8rem;
        font-size: 0.88rem;
    }
    .toggle-btn{
        padding: 0.7rem 1rem;
        font-size: 0.95rem;
    }
    .divider{
        margin: 1.5rem 0 0.9rem;
    }
    .output-row{
        padding: 0.8rem 1.4rem;
    }
    .output-row .label{
        font-size: 0.95rem;
    }
    .output-row .value{
        font-size: 1.15rem;
    }
    body::before{
        width: 500px;
        height: 500px;
    }
    body::after{
        width: 450px;
        height: 450px;
    }
}

/* 📱 Mobile */
@media (max-width: 480px){
    body{padding: 1.2rem 0.8rem 2rem;}
    .page-title h1{font-size: 1.5rem;}
    .page-title p{font-size: 0.72rem;}
    .card{padding: 1.4rem 1rem 1.6rem; border-radius: 1.6rem;}
    .row{padding: 0.5rem 0.75rem;}
    .row label{min-width: 72px; font-size: 0.75rem;}
    .row input{font-size: 0.82rem; padding: 0.45rem 0.8rem;}
    .toggle-btn{font-size: 0.75rem; padding: 0.5rem 0.5rem;}
    .row.coin-row{padding: 0.4rem 0.6rem;}
    .row.coin-row label{min-width: 48px; font-size: 0.72rem;}
    .row.coin-row .toggle-btn{padding: 0.4rem 0.4rem; font-size: 0.7rem;}
    h2{font-size: 1.05rem;}
    h2 span{font-size: 0.58rem; padding: 0.12rem 0.55rem;}
    body::before, body::after{opacity: 0.2;}
}

@media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>
<div class="wrapper">

    <div class="page-title">
        <h1>Position Size Calculator</h1>
        <p>Calculate your perfect lot size with precision</p>
        <span class="underline"></span>
    </div>

    <div class="card">
        <h2>Trade Setup <span>lot + risk</span></h2>

        <div class="grid">

            <div class="row coin-row">
                <label>Coin</label>
                <div class="toggle-group" id="coinToggle">
                    <button type="button" class="toggle-btn active" data-coin="BTC">BTC</button>
                    <button type="button" class="toggle-btn" data-coin="ETH">ETH</button>
                    <button type="button" class="toggle-btn" data-coin="XAUT">XAUT</button>
                    <button type="button" class="toggle-btn" data-coin="CUSTOM">CUSTOM</button>
                </div>
            </div>

            <div class="row">
                <label>Direction</label>
                <div class="toggle-group" id="directionToggle">
                    <button type="button" class="toggle-btn active long" data-direction="long">Long</button>
                    <button type="button" class="toggle-btn" data-direction="short">Short</button>
                </div>
            </div>

            <div class="row">
                <label>Unit</label>
                <div class="toggle-group" id="unitToggle">
                    <button type="button" class="toggle-btn" data-unit="coins">Coins</button>
                    <button type="button" class="toggle-btn active" data-unit="lots">Lots</button>
                </div>
            </div>

            <div class="row">
                <label>SL Mode</label>
                <div class="toggle-group" id="slmodeToggle">
                    <button type="button" class="toggle-btn" data-slmode="price">Price</button>
                    <button type="button" class="toggle-btn active" data-slmode="pips">Pips</button>
                </div>
            </div>

            <div class="row">
                <label>Capital (USD)</label>
                <input type="number" id="capital" value="" step="0.01" min="0.01" placeholder="0.00" />
            </div>

            <div class="row">
                <label>Risk %</label>
                <input type="number" id="riskPercent" value="" step="0.1" min="0.1" placeholder="0" />
                <span class="badge">%</span>
            </div>

            <div class="row hidden" id="leverageRow">
                <label>Leverage</label>
                <input type="number" id="leverage" value="" step="1" min="1" placeholder="0" />
                <span class="badge">x</span>
            </div>

            <div class="row hidden" id="entryRow">
                <label>Entry Price</label>
                <input type="number" id="entryPrice" value="" step="0.01" min="0.01" placeholder="0.00" />
            </div>

            <div class="row hidden" id="stopRow">
                <label>Stop-Loss</label>
                <input type="number" id="stopLoss" value="" step="0.01" min="0.01" placeholder="0.00" />
            </div>

            <div class="row" id="pipsRow">
                <label>SL (Pips)</label>
                <input type="number" id="pipsSL" value="" step="1" min="1" placeholder="0" />
                <span class="badge">pips</span>
            </div>

            <div class="row">
                <label>Lot Size</label>
                <input type="number" id="lotSize" value="" step="0.0001" min="0.00001" placeholder="0.0000" />
                <span class="badge" id="lotUnit">BTC</span>
            </div>
        </div>

        <hr class="divider" />

        <div class="output-grid">
            <div class="output-row">
                <span class="label">Adjusted Position</span>
                <span class="value highlight" id="adjustedSize">—</span>
            </div>
            <div class="output-row" id="notionalRow">
                <span class="label">Notional Value</span>
                <span class="value" id="notional">—</span>
            </div>
            <div class="output-row" id="marginRow">
                <span class="label">Margin Required</span>
                <span class="value" id="margin">—</span>
            </div>
            <div class="output-row" id="riskRow">
                <span class="label">Actual Risk %</span>
                <span class="value warn" id="actualRisk">—</span>
            </div>
            <div class="output-row" style="border-left-color:#5f7fb0">
                <span class="label">Max Loss ($)</span>
                <span class="value" id="maxLoss">—</span>
            </div>
        </div>

        <div class="warning-box" id="warningBox" style="display:none">
            Position is less than 1 lot
        </div>
    </div>
</div>

<script>
(function(){
    'use strict';

    const $ = id => document.getElementById(id);
    const coinToggle = $('coinToggle'),
          directionToggle = $('directionToggle'),
          unitToggle = $('unitToggle'),
          slmodeToggle = $('slmodeToggle'),
          lotUnit = $('lotUnit'),
          capitalInp = $('capital'),
          riskInp = $('riskPercent'),
          leverageInp = $('leverage'),
          entryInp = $('entryPrice'),
          stopInp = $('stopLoss'),
          pipsInp = $('pipsSL'),
          lotInp = $('lotSize'),
          leverageRow = $('leverageRow'),
          entryRow = $('entryRow'),
          stopRow = $('stopRow'),
          pipsRow = $('pipsRow'),
          adjustedSizeEl = $('adjustedSize'),
          notionalEl = $('notional'),
          marginEl = $('margin'),
          actualRiskEl = $('actualRisk'),
          maxLossEl = $('maxLoss'),
          warningBox = $('warningBox'),
          notionalRow = $('notionalRow'),
          marginRow = $('marginRow');

    let currentCoin = 'BTC';
    let currentDirection = 'long';
    let currentUnit = 'lots';
    let currentSLMode = 'pips';
    let rafId = null;
    const coinLabels = { BTC:'BTC', ETH:'ETH', XAUT:'XAUT', CUSTOM:'CUSTOM' };

    const getVal = inp => {
        const v = parseFloat(inp.value);
        return isNaN(v) || v < 0 ? 0 : v;
    };

    const fmtCurrency = v => {
        if (v === 0) return '$0.00';
        if (v < 0.01) return '$' + v.toFixed(4);
        return '$' + v.toFixed(2);
    };

    const fmtCoins = v => {
        if (v === 0) return '0';
        if (v < 1) return v.toFixed(4);
        if (v < 100) return v.toFixed(2);
        return v.toFixed(0);
    };

    function setVal(el, text){
        if (el.textContent !== text){
            el.textContent = text;
            el.classList.add('flash');
            clearTimeout(el._flashTimer);
            el._flashTimer = setTimeout(() => el.classList.remove('flash'), 400);
        }
    }

    function updateLotUnit(){
        lotUnit.textContent = coinLabels[currentCoin] || 'CUSTOM';
    }

    function updateSLModeUI(){
        const priceMode = currentSLMode === 'price';
        leverageRow.classList.toggle('hidden', !priceMode);
        entryRow.classList.toggle('hidden', !priceMode);
        stopRow.classList.toggle('hidden', !priceMode);
        pipsRow.classList.toggle('hidden', priceMode);
        notionalRow.classList.toggle('dim', !priceMode);
        marginRow.classList.toggle('dim', !priceMode);
    }

    function calculate(){
        const capital = getVal(capitalInp);
        const riskPercent = getVal(riskInp);
        const lot = getVal(lotInp);
        const pips = getVal(pipsInp);

        if (capital <= 0 || riskPercent <= 0 || lot <= 0) return null;

        if (currentSLMode === 'pips'){
            if (pips <= 0) return null;
            const maxLossDollar = capital * (riskPercent / 100);
            const idealCoins = maxLossDollar / pips;

            let lots = 0, adjustedCoins = 0;
            if (idealCoins > 0){
                lots = Math.floor(idealCoins / lot);
                if (lots >= 1) adjustedCoins = lots * lot;
                else lots = 0;
            }

            return {
                mode: 'pips',
                lots,
                adjustedCoins,
                maxLossDollar,
                belowLot: lots === 0 && idealCoins > 0
            };
        }

        const leverage = getVal(leverageInp);
        const entry = getVal(entryInp);
        const stop = getVal(stopInp);

        if (leverage <= 0 || entry <= 0 || stop <= 0) return null;

        if (currentDirection === 'long' && stop >= entry) return { error: 'SL must be < Entry' };
        if (currentDirection === 'short' && stop <= entry) return { error: 'SL must be > Entry' };

        const priceRisk = Math.abs(entry - stop);
        if (priceRisk <= 0) return null;

        const maxLossDollar = capital * (riskPercent / 100);
        const idealFromRisk = maxLossDollar / priceRisk;
        const maxBuyingPower = capital * leverage;
        const maxFromLeverage = maxBuyingPower / entry;
        const idealCoins = Math.min(idealFromRisk, maxFromLeverage);

        let lots = 0, adjustedCoins = 0;
        if (idealCoins > 0){
            lots = Math.floor(idealCoins / lot);
            if (lots >= 1) adjustedCoins = lots * lot;
            else lots = 0;
        }

        const notional = adjustedCoins * entry;
        const margin = notional / leverage;
        const actualRiskPercent = capital > 0 && adjustedCoins > 0
            ? (adjustedCoins * priceRisk) / capital * 100
            : 0;

        return {
            mode: 'price',
            lots,
            adjustedCoins,
            notional,
            margin,
            actualRiskPercent,
            maxLossDollar,
            belowLot: lots === 0 && idealCoins > 0
        };
    }

    function render(result){
        if (!result){
            setVal(adjustedSizeEl, '—');
            setVal(notionalEl, '—');
            setVal(marginEl, '—');
            setVal(actualRiskEl, '—');
            setVal(maxLossEl, '—');
            warningBox.style.display = 'none';
            return;
        }

        if (result.error){
            setVal(adjustedSizeEl, '⚠ ' + result.error);
            setVal(notionalEl, '—');
            setVal(marginEl, '—');
            setVal(actualRiskEl, '—');
            setVal(maxLossEl, '—');
            warningBox.style.display = 'none';
            return;
        }

        const coinLabel = coinLabels[currentCoin] || 'CUSTOM';
        const { mode, lots, adjustedCoins, notional, margin, actualRiskPercent, maxLossDollar, belowLot } = result;

        const adjText = adjustedCoins > 0
            ? (currentUnit === 'lots' ? lots + ' lots' : fmtCoins(adjustedCoins) + ' ' + coinLabel)
            : 'Below 1 lot';

        setVal(adjustedSizeEl, adjText);
        setVal(maxLossEl, fmtCurrency(maxLossDollar));

        if (mode === 'price'){
            setVal(notionalEl, fmtCurrency(notional));
            setVal(marginEl, fmtCurrency(margin));
            setVal(actualRiskEl, actualRiskPercent.toFixed(2) + '%');

            if (actualRiskPercent > getVal(riskInp)){
                actualRiskEl.className = 'value danger flash';
            } else if (actualRiskPercent > 0){
                actualRiskEl.className = 'value warn';
            } else {
                actualRiskEl.className = 'value';
            }
        } else {
            setVal(notionalEl, '—');
            setVal(marginEl, '—');
            setVal(actualRiskEl, '—');
            actualRiskEl.className = 'value warn';
        }

        warningBox.style.display = belowLot ? 'block' : 'none';
    }

    function scheduleCompute(){
        if (rafId) return;
        rafId = requestAnimationFrame(() => {
            rafId = null;
            render(calculate());
        });
    }

    coinToggle.addEventListener('click', e => {
        const btn = e.target.closest('.toggle-btn');
        if (!btn) return;
        coinToggle.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCoin = btn.dataset.coin;
        updateLotUnit();
        scheduleCompute();
    });

    directionToggle.addEventListener('click', e => {
        const btn = e.target.closest('.toggle-btn');
        if (!btn) return;
        directionToggle.querySelectorAll('.toggle-btn').forEach(b => {
            b.classList.remove('active', 'long', 'short');
        });
        btn.classList.add('active');
        currentDirection = btn.dataset.direction;
        btn.classList.add(currentDirection === 'long' ? 'long' : 'short');
        scheduleCompute();
    });

    unitToggle.addEventListener('click', e => {
        const btn = e.target.closest('.toggle-btn');
        if (!btn) return;
        unitToggle.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentUnit = btn.dataset.unit;
        scheduleCompute();
    });

    slmodeToggle.addEventListener('click', e => {
        const btn = e.target.closest('.toggle-btn');
        if (!btn) return;
        slmodeToggle.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSLMode = btn.dataset.slmode;
        updateSLModeUI();
        scheduleCompute();
    });

    const card = document.querySelector('.card');
    card.addEventListener('input', scheduleCompute, { passive: true });

    updateLotUnit();
    updateSLModeUI();
})();
</script>
</body>
</html>
